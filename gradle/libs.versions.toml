[versions]
# Compatibility group resolved 2026-08-23 from Maven Central / Google Maven /
# services.gradle.org. AGP 9.3 requires Gradle >= 9.5.0 and supports API 37.
# API 37 is published as platforms/android-37.0 (minor 0). See
# docs/DEPENDENCY_REVIEW.md.
agp = "9.3.1"
android-compileSdk = "37"
android-compileSdkMinor = "0"
android-minSdk = "24"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
androidx-testExt = "1.3.0"
composeMultiplatform = "1.11.1"
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlincrypto-blake2 = "0.8.0"
kotlincrypto-sha2 = "0.8.0"
bouncycastle-bcprov = "1.85.2"
bip32-ed25519 = "1.8.8"
androidx-test-runner = "1.7.0"
ionspin-libsodium = "0.9.5"
# 1.6c-follow-up-2 gate result (ADR-0010): Android public-key-projection backend, verified by
# on-device execution on API 24/35/36. See ADR-0010 for the full evidence.
lazysodium-android = "5.2.0"
jna = "5.19.1"
ktor = "3.5.2"
# Latest Compose Multiplatform 1.11.x Material3 artifact. 1.12.0-alpha03 tracks
# Compose 1.12.0-rc01 and is outside this compatibility group.
material3 = "1.11.0-alpha07"
# ADR-0016 §9 (Block 1.10b backend adoption): the pre-generated UniFFI bindings in
# :crypto-signing-backend use kotlinx.atomicfu for their handle-map counter. Version matches what
# the disposable spike's Gobley toolchain resolved (ADR-0016 §8, scratch README).
atomicfu = "0.26.1"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlincrypto-blake2 = { module = "org.kotlincrypto.hash:blake2", version.ref = "kotlincrypto-blake2" }
kotlincrypto-sha2 = { module = "org.kotlincrypto.hash:sha2", version.ref = "kotlincrypto-sha2" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle-bcprov" }
# 1.6c-follow-up gate result: swapped from the dev.allain republish to the upstream
# org.hyperledger.identus coordinate, whose bip32-ed25519-android AAR ships the native
# jni/<abi>/*.so (dev.allain's did not) — verified on real Android runtime. See ADR-0010.
bip32-ed25519 = { module = "org.hyperledger.identus:bip32-ed25519", version.ref = "bip32-ed25519" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
# 1.6c-follow-up gate result: public-key projection backend for JVM + iOS (see ADR-0010). The
# published Android native library is missing the crypto_scalarmult_ed25519_* symbols
# (confirmed UnsatisfiedLinkError on real Android runtime across every published version), so
# this is not an androidMain dependency there; Android uses lazysodium-android instead (below).
ionspin-libsodium = { module = "com.ionspin.kotlin:multiplatform-crypto-libsodium-bindings", version.ref = "ionspin-libsodium" }
kotlinx-coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
# 1.6c-follow-up-2 gate result (ADR-0010): Android-only public-key-projection backend — its AAR
# bundles a full libsodium .so exporting crypto_scalarmult_ed25519_base_noclamp on all four ABIs,
# verified by symbol inspection and by on-device execution (API 24/35/36). androidMain-only.
lazysodium-android = { module = "com.goterl:lazysodium-android", version.ref = "lazysodium-android" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
atomicfu = { id = "org.jetbrains.kotlin.plugin.atomicfu", version.ref = "kotlin" }