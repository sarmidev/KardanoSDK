# Project-owned Rust wrapper for the `:crypto-signing-backend` SDK module (ADR-0016 §9, Option R1).
# Wraps `ed25519-bip32 = "0.4.2"` (MIT OR Apache-2.0) via UniFFI to expose Cardano extended
# Ed25519-BIP32 signing — `XPrv::sign` / `XPub::verify`. No handwritten crypto: both exported
# functions delegate directly to the reference crate.
#
# `publish = false`: this crate is vendored in-repo and built ahead of time into the committed
# native artifacts under `src/{jvmMain/resources,androidMain/jniLibs,nativeInterop}` — it is not a
# crates.io package. See `README.md` for the exact, offline regeneration commands and versions.
[package]
name = "kardano-ed25519-bip32-signing"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# cdylib -> JVM (JNA over a bundled .dylib/.so) + Android (jniLibs .so)
# staticlib -> iOS (Kotlin/Native cinterop over a static .a)
crate-type = ["cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"

[dependencies]
uniffi = "0.29.4"
ed25519-bip32 = "0.4.2"
