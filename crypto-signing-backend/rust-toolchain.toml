# rustup pin for offline native regeneration. Channel is the exact
# toolchain recorded in README.md (verified 2026-08-23).
[toolchain]
channel = "1.97.0"
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "i686-linux-android",
    "x86_64-linux-android",
]
