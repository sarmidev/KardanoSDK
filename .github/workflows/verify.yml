name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

jobs:
  restricted-claim-scan:
    name: Restricted-claim (banned-word) scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run restricted-claim and archive regression tests
        run: >-
          python3 -m unittest
          scripts.tests.test_check_restricted_claims
          scripts.tests.test_check_handoff_archive
      - name: Run native-artifact catalog tests
        run: >-
          python3 -m unittest
          discover
          -s crypto-signing-backend/scripts/tests
          -p "test_*.py"
      - name: Verify HANDOFF archive bytes
        run: python3 scripts/check_handoff_archive.py
      - name: Scan tracked docs/markdown/source for banned claim language
        # Scope note (W9-3): claim-language scan only. Credential scanning is a
        # separate job. Phrase list, match-by-match classification, and exact
        # path exclusions live in scripts/check_restricted_claims.py.
        run: python3 scripts/check_restricted_claims.py

  legal-evidence-scan:
    name: Legal-evidence packet (NOTICE/LICENSES/native/lock inventory)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust (pinned toolchain)
        run: |
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          rustup default 1.97.0
      - name: Capture pre-generation worktree state
        run: |
          git status --porcelain=v1 > /tmp/worktree-before.txt
          git diff --binary > /tmp/tracked-diff-before.patch
          sha256sum crypto-signing-backend/Cargo.lock > /tmp/cargo-lock-before.sha256
      - name: Bootstrap Cargo registry over the network (--locked only, no lockfile edits)
        # This is the ONLY step in this job that is allowed real network
        # access. It fetches exactly the crates crypto-signing-backend/Cargo.lock
        # already pins (a --locked fetch fails rather than re-resolving), and
        # every later step in this job runs with CARGO_NET_OFFLINE=true so a
        # generator/test that tried to reach the network would fail loudly
        # instead of silently re-resolving or mutating the lockfile.
        run: |
          cargo fetch --locked --manifest-path crypto-signing-backend/Cargo.toml
          cut -d' ' -f1 /tmp/cargo-lock-before.sha256 > /tmp/before.hash
          sha256sum crypto-signing-backend/Cargo.lock | cut -d' ' -f1 > /tmp/after.hash
          diff /tmp/before.hash /tmp/after.hash
      - name: Run legal-evidence regression tests
        env:
          CARGO_NET_OFFLINE: "true"
        run: >-
          python3 -m unittest
          scripts.tests.test_generate_legal_evidence
          scripts.tests.test_check_release_evidence
      - name: Regenerate from a clean temporary GRADLE_USER_HOME (proves no local-cache dependency)
        # This job never installs a JDK or runs any ./gradlew task, so this
        # runner's Gradle cache is already empty -- GRADLE_USER_HOME is set
        # explicitly here anyway so the property is visible in the log, not
        # just incidental to this job's step order. A 2026-08-24 independent
        # review found gradle_license_inventory() previously required a
        # pre-populated local Gradle POM cache to resolve every coordinate;
        # scripts/license_catalog.py + scripts/license_catalog_harvested.py
        # are now a complete, committed catalog, and
        # scripts/generate_legal_evidence.py fails closed (raises, writes
        # nothing) if any coordinate is still unresolved.
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          rm -rf "$RUNNER_TEMP/cold-gradle-home"
          mkdir -p "$RUNNER_TEMP/cold-gradle-home"
          GRADLE_USER_HOME="$RUNNER_TEMP/cold-gradle-home" python3 scripts/generate_legal_evidence.py
          cp -r docs/evidence /tmp/legal-evidence-cold-cache
      - name: Regenerate evidence twice and diff
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          python3 scripts/generate_legal_evidence.py
          cp -r docs/evidence /tmp/legal-evidence-run1
          python3 scripts/generate_legal_evidence.py
          diff -rq /tmp/legal-evidence-run1 docs/evidence
      - name: Fail if cold-cache output differs from the committed evidence
        run: diff -rq /tmp/legal-evidence-cold-cache docs/evidence
      - name: Fail on uncommitted evidence drift
        run: git diff --exit-code -- docs/evidence
      - name: Fail if generation touched anything outside docs/evidence/
        # Defense in depth beyond the per-call Cargo.lock hash guards inside
        # scripts/generate_legal_evidence.py itself: every generator/test
        # step above ran with CARGO_NET_OFFLINE=true, so a script that tried
        # to silently re-resolve or fetch would have failed loudly instead.
        # This step independently re-diffs the ENTIRE tracked worktree
        # (not just docs/evidence/) against the pre-generation snapshot and
        # fails if anything other than docs/evidence/ changed -- e.g. a
        # generator bug that rewrote Cargo.lock, a gradle.lockfile, or any
        # other tracked source file would be caught here even if every
        # narrower check above happened to miss it.
        run: |
          git status --porcelain=v1 | awk '{print $2}' | grep -v '^docs/evidence/' > /tmp/worktree-after-non-evidence.txt || true
          if [ -s /tmp/worktree-after-non-evidence.txt ]; then
            echo "Tracked files outside docs/evidence/ changed during legal-evidence generation:"
            cat /tmp/worktree-after-non-evidence.txt
            exit 1
          fi
          cut -d' ' -f1 /tmp/cargo-lock-before.sha256 > /tmp/cargo-lock-before-final.hash
          sha256sum crypto-signing-backend/Cargo.lock | cut -d' ' -f1 > /tmp/cargo-lock-final.hash
          diff /tmp/cargo-lock-before-final.hash /tmp/cargo-lock-final.hash
      - name: Run the release-evidence checker
        run: python3 scripts/check_release_evidence.py

  action-pin-scan:
    name: Action SHA-pin scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run action-pin regression tests
        run: python3 -m unittest scripts.tests.test_check_action_pins
      - name: Verify workflow Action pins and composite metadata
        run: python3 scripts/check_action_pins.py

  credential-scan:
    name: Full-history credential scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch every ref the checkout can see
        run: git fetch --prune --tags origin
      - name: Run Gitleaks helper, installer, and allowlist tests
        run: python3 -m unittest scripts.tests.test_gitleaks_allowlist
      - name: Install pinned Gitleaks CLI
        # CLI only — not a third-party Action wrapper. Version and SHA-256 are
        # pinned in scripts/install_gitleaks.py (resolved live from the
        # official GitHub release checksums file).
        run: python3 scripts/install_gitleaks.py --dest "$RUNNER_TEMP/gitleaks"
      - name: Scan git history with redacted output
        run: >-
          python3 scripts/check_gitleaks.py
          --binary "$RUNNER_TEMP/gitleaks"

  portable-jvm-and-android-host:
    name: Portable JVM and Android host tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # Explicit v4.4.3/v5.0.2 defaults. v6 is not adopted (see
          # docs/DEPENDENCY_REVIEW.md).
          cache-disabled: false
          cache-read-only: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}
          cache-write-only: false
          cache-cleanup: on-success
      - name: Run portable JVM tests
        run: >-
          ./gradlew --no-daemon
          :core:jvmTest
          :provider:jvmTest
          :provider-blockfrost:jvmTest
          :tx:jvmTest
      - name: Run Android host tests
        run: >-
          ./gradlew --no-daemon
          :core:testAndroidHostTest
          :crypto:testAndroidHostTest
          :provider:testAndroidHostTest
          :provider-blockfrost:testAndroidHostTest
          :wallet:testAndroidHostTest
          :tx:testAndroidHostTest

  macos-signing-and-ios:
    name: macOS signing tests and iOS compile/link
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # Explicit v4.4.3/v5.0.2 defaults. v6 is not adopted (see
          # docs/DEPENDENCY_REVIEW.md).
          cache-disabled: false
          cache-read-only: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}
          cache-write-only: false
          cache-cleanup: on-success
      - name: Run macOS signing-path JVM tests
        run: >-
          ./gradlew --no-daemon
          :crypto:jvmTest
          :crypto-signing-backend:jvmTest
          :wallet:jvmTest
          :shared:jvmTest
      - name: Run shared Android host tests
        run: ./gradlew --no-daemon :shared:testAndroidHostTest
      - name: Compile iOS targets and link simulator tests
        run: >-
          ./gradlew --no-daemon
          :core:compileKotlinIosArm64
          :crypto:compileKotlinIosArm64
          :crypto-signing-backend:compileKotlinIosArm64
          :provider:compileKotlinIosArm64
          :provider-blockfrost:compileKotlinIosArm64
          :wallet:compileKotlinIosArm64
          :tx:compileKotlinIosArm64
          :shared:compileKotlinIosArm64
          :crypto-signing-backend:linkDebugTestIosSimulatorArm64

  android-lint:
    name: Android lint and assemble
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # Explicit v4.4.3/v5.0.2 defaults. v6 is not adopted (see
          # docs/DEPENDENCY_REVIEW.md).
          cache-disabled: false
          cache-read-only: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}
          cache-write-only: false
          cache-cleanup: on-success
      - name: Lint Debug and Release
        run: >-
          ./gradlew --no-daemon
          :androidApp:lintDebug
          :androidApp:lintRelease
      - name: Assemble Debug and Release
        run: >-
          ./gradlew --no-daemon
          :androidApp:assembleDebug
          :androidApp:assembleRelease
